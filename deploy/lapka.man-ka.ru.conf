server {
    listen 80;
    server_name lapka.man-ka.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/man-ka-acme;
    }

    location / {
        return 308 https://lapka.man-ka.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lapka.man-ka.ru;

    ssl_certificate /etc/letsencrypt/live/lapka.man-ka.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lapka.man-ka.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
